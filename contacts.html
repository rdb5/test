<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Ghost</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
</head>
<body>
  <div class="app-shell">
    <div class="topbar">
      <button class="icon-btn" onclick="location.href='settings.html'">⚙️</button>
      <h1>Ghost</h1>
      <button class="icon-btn" onclick="location.href='qr-connect.html?mode=create'">➕</button>
    </div>

    <div id="list" class="list"></div>
  </div>

  <button class="fab" onclick="location.href='qr-connect.html?mode=create'">＋</button>
  <div id="toast" class="toast"></div>

  <script src="js/store.js"></script>
  <script src="js/nostr-signal.js"></script>
  <script>
    let identity, signal;

    async function loadNostrTools() {
      if (!window.NostrTools) {
        window.NostrTools = await import('https://esm.sh/nostr-tools@2.10.4');
      }
      return window.NostrTools;
    }

    function timeAgo(ts) {
      if (!ts) return 'لم يتم التواصل بعد';
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 60) return 'قبل لحظات';
      if (s < 3600) return `قبل ${Math.floor(s/60)} د`;
      if (s < 86400) return `قبل ${Math.floor(s/3600)} س`;
      return `قبل ${Math.floor(s/86400)} يوم`;
    }

    function showToast(msg, ms = 3000) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), ms);
    }

    async function renderList() {
      const list = document.getElementById('list');
      const contacts = await Store.allContacts();
      contacts.sort((a, b) => (b.lastActivity || 0) - (a.lastActivity || 0));
      if (!contacts.length) {
        list.innerHTML = `<div class="empty-state">لا يوجد جهات اتصال بعد 👻<br><br>
          اضغط على زر "+" لإنشاء رمز QR لمرة واحدة وشاركه مع من تريد التحدث معه،
          أو امسح رمزاً تلقيته منه.</div>`;
        return;
      }
      list.innerHTML = contacts.map(c => `
        <div class="contact-row" onclick="location.href='chat.html?pub=${c.pubkey}'">
          <div class="avatar">${(c.name || '?')[0].toUpperCase()}</div>
          <div class="contact-meta">
            <div class="contact-name">${escapeHtml(c.name || 'مجهول')}</div>
            <div class="contact-sub">${c.online ? 'متصل الآن' : timeAgo(c.lastActivity)}</div>
          </div>
          <div class="status-dot ${c.online ? 'online' : ''}"></div>
        </div>
      `).join('');
    }

    function escapeHtml(s) {
      const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
    }

    async function init() {
      await loadNostrTools();
      identity = await Store.getIdentity();
      if (!identity) { location.href = 'auth.html'; return; }

      await renderList();

      signal = new NostrSignal(identity);
      await signal.loadRelays();
      signal.start();

      // Presence pings light up the green dot in the list
      signal.on(SIGNAL_KINDS.KIND_PRESENCE, async ({ from }) => {
        const c = await Store.getContact(from);
        if (c) { c.online = true; c.lastActivity = Date.now(); await Store.upsertContact(c); renderList(); }
      });

      // Someone is ringing us while we're sitting on the contacts screen
      signal.on(SIGNAL_KINDS.KIND_RING, async ({ from, name }) => {
        let c = await Store.getContact(from);
        if (!c) return; // only known contacts can ring (QR handshake required first)
        c.lastActivity = Date.now();
        await Store.upsertContact(c);
        if (Notification.permission === 'granted') {
          const n = new Notification(`${c.name} يريد التحدث معك 👻`, { body: 'اضغط لفتح المحادثة الآن', tag: 'ghost-ring' });
          n.onclick = () => { window.focus(); location.href = `chat.html?pub=${from}&autoanswer=1`; };
        } else {
          showToast(`${c.name} يريد التحدث معك — اضغط لفتح`, 5000);
        }
        renderList();
      });

      // Removal request: contact deleted themself from your side
      signal.on(SIGNAL_KINDS.KIND_BYE, async ({ from, removeContact }) => {
        if (removeContact) {
          await Store.deleteContact(from);
          renderList();
        }
      });

      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('js/sw.js').catch(() => {});
      }
    }
    init();
    window.addEventListener('pagehide', () => { if (signal) signal.stop(); });
  </script>
</body>
</html>

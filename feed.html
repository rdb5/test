<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ميدان — الرئيسية</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .composer-post {
    display:flex; gap:10px; align-items:center;
    padding:14px 16px; border-bottom:1px solid var(--hairline);
  }
  .composer-post .fake-input {
    flex:1; background:var(--surface); border:1px solid var(--hairline);
    border-radius:20px; padding:10px 16px; color:var(--text-faint); font-size:13.5px;
  }
  .composer-post .icon-btn { background:var(--surface); border:1px solid var(--hairline); }
  .for-you-note {
    display:flex; align-items:center; gap:8px;
    padding:10px 16px; font-size:12px; color:var(--text-faint);
  }
  .for-you-note svg { width:13px;height:13px; color:var(--accent); }
</style>
</head>
<body>
<div class="app-shell">

  <div id="header-mount"></div>

  <div class="tabs">
    <div class="tab active">لك</div>
    <div class="tab">يتابعهم</div>
    <div class="tab">قريب منك</div>
  </div>

  <main class="content">
    <div class="composer-post">
      <div class="avatar sm">أ</div>
      <div class="fake-input" onclick="location.href='profile.html'">بم تفكر الآن؟</div>
      <button class="icon-btn" id="camera-icon"></button>
    </div>

    <div class="for-you-note" id="algo-note"></div>

    <div id="feed-mount"></div>

    <div class="empty-state">
      <div class="title">وصلت لآخر المحتوى الجديد</div>
      <div class="desc">استكشف مجتمعات جديدة من صفحة المجتمعات لتوسيع ما يظهر لك هنا.</div>
    </div>
  </main>

  <div id="nav-mount"></div>
</div>

<script src="js/app.js"></script>
<script>
  mountShell({ active: 'feed', title: 'ميدان' });
  renderFeed('feed-mount');
  document.getElementById('camera-icon').innerHTML = icon('camera');
  document.getElementById('algo-note').innerHTML = icon('shield') + ' هذا الترتيب يعتمد على تفاعلك الفعلي، وليس على من يدفع أكثر';

  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
    });
  });
</script>
</body>
</html>

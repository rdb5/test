<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Ghost — رسائل بلا أثر</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <div class="center-col">
      <div class="logo-orb"></div>
      <div class="brand-title">Ghost</div>
      <div class="tagline">محادثات فورية من هاتف إلى هاتف مباشرة<br>لا تخزين. لا سيرفر يرى رسائلك. لا أثر.</div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script>
    (async () => {
      const identity = await Store.getIdentity();
      // small delay just so the splash isn't a flicker
      setTimeout(() => {
        window.location.href = identity ? 'contacts.html' : 'auth.html';
      }, 500);
    })();
  </script>
</body>
</html>

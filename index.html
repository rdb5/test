<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost P2P Messenger</title>
    <style>
        :root {
            --bg-black: #000000;
            --modal-gray: #1c1c1e;
            --accent-blue: #0a84ff;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --danger-red: #ff453a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-black); color: var(--text-main); overflow: hidden; height: 100vh; width: 100vw; }

        .view { display: none; height: 100%; width: 100%; flex-direction: column; animation: fadeIn 0.3s ease; }
        .view.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid #333; background: var(--bg-black); z-index: 10; }
        .header h1 { font-size: 1.2rem; font-weight: 600; }
        .btn-text { background: none; border: none; color: var(--accent-blue); font-size: 1rem; cursor: pointer; }
        .btn-text.danger { color: var(--danger-red); }

        .list-container { flex: 1; overflow-y: auto; padding: 20px; }
        .contact-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: var(--modal-gray); border-radius: 12px; margin-bottom: 10px; }
        
        .btn-primary { background: var(--accent-blue); color: white; border: none; padding: 14px 20px; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; }
        .btn-ring { background: #32d74b; color: #000; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }

        #chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 75%; padding: 12px 16px; border-radius: 18px; line-height: 1.4; word-wrap: break-word; }
        .message.sent { background: var(--accent-blue); align-self: flex-start; border-bottom-right-radius: 4px; }
        .message.received { background: var(--modal-gray); align-self: flex-end; border-bottom-left-radius: 4px; }
        .message.flame { background: transparent; border: 1px solid var(--danger-red); color: var(--danger-red); text-align: center; cursor: pointer; }
        .message.system { background: transparent; color: #32d74b; align-self: center; font-size: 0.8rem; }

        .chat-input-area { display: flex; gap: 10px; padding: 15px 20px; background: var(--bg-black); border-top: 1px solid #333; }
        .chat-input-area input { flex: 1; background: var(--modal-gray); border: none; padding: 12px 16px; border-radius: 20px; color: white; outline: none; }
        .btn-send { background: var(--accent-blue); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: flex-end; }
        .modal-content { background: var(--modal-gray); width: 100%; max-width: 500px; padding: 25px; border-radius: 20px 20px 0 0; text-align: center; }
        .qr-box { width: 200px; height: 200px; background: white; margin: 20px auto; border-radius: 12px; display: flex; justify-content: center; align-items: center; color: black; font-weight: bold; }
    </style>
</head>
<body>

    <div id="view-splash" class="view active">
        <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; text-align: center;">
            <h1 style="font-size: 2.5rem; margin-bottom: 10px;">Ghost P2P</h1>
            <p style="color: var(--text-muted); margin-bottom: 40px;">لا سيرفرات. لا تخزين. خصوصية 10000%.</p>
            <button class="btn-primary" onclick="app.initApp()">توليد هوية مشفرة والدخول</button>
        </div>
    </div>

    <div id="view-contacts" class="view">
        <div class="header">
            <button class="btn-text" onclick="app.showModal('qr-modal')">مسح QR 📸</button>
            <h1>الشبكة المظلمة (P2P)</h1>
            <button class="btn-text" onclick="app.showModal('my-qr-modal')">إضافة ➕</button>
        </div>
        <div class="list-container" id="contacts-list">
            <div class="contact-item">
                <div>
                    <h3 style="font-size: 1.1rem;">جهاز تجريبي</h3>
                    <p style="color: var(--text-muted); font-size: 0.8rem;">نظام الاتصال المباشر</p>
                </div>
                <button class="btn-ring" onclick="app.sendNostrSignal()">إرسال نداء 🔔</button>
            </div>
        </div>
    </div>

    <div id="view-chat" class="view">
        <div class="header">
            <button class="btn-text danger" onclick="app.destroyChat()">تدمير وخروج 🔴</button>
            <h1 id="chat-title">غرفة آمنة</h1>
            <span id="conn-status" style="color: var(--text-muted); font-size: 0.8rem;">● جاري الاتصال...</span>
        </div>
        <div id="chat-messages"></div>
        <div class="chat-input-area">
            <button class="btn-text" onclick="app.sendFlameMessage()" style="font-size: 1.5rem;">🔥</button>
            <input type="text" id="msg-input" placeholder="رسالة لا تُخزن..." onkeypress="if(event.key === 'Enter') app.sendTextMessage()">
            <button class="btn-send" onclick="app.sendTextMessage()">➤</button>
        </div>
    </div>

    <div id="my-qr-modal" class="modal-overlay" onclick="app.closeModal(event, 'my-qr-modal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2>شارك هذا الكود</h2>
            <p style="color: var(--text-muted); margin-top: 10px; font-size: 0.9rem;">سيتم إتلافه فور المسح (NIP-44).</p>
            <div class="qr-box">QR [مؤقت]</div>
            <button class="btn-primary" style="background: var(--bg-black); margin-top: 20px;" onclick="app.closeModal(null, 'my-qr-modal')">إلغاء</button>
        </div>
    </div>

    <div id="qr-modal" class="modal-overlay" onclick="app.closeModal(event, 'qr-modal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2>مسح كود صديق</h2>
            <div style="width: 100%; height: 200px; background: #000; border: 2px dashed #333; margin: 20px 0; border-radius: 12px; display: flex; justify-content: center; align-items: center;">الكاميرا...</div>
            <button class="btn-primary" onclick="app.closeModal(null, 'qr-modal'); alert('تم التبادل المباشر')">محاكاة المسح</button>
        </div>
    </div>

    <script>
        const app = {
            nostrRelay: null,
            peerConnection: null,
            dataChannel: null,

            navigate: function(viewId) {
                document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
                document.getElementById(viewId).classList.add('active');
            },

            initApp: function() {
                this.navigate('view-contacts');
                this.connectNostr();
            },

            // 1. اتصال Nostr (يعمل كجرس فقط، دون تخزين - NIP-16)
            connectNostr: function() {
                this.nostrRelay = new WebSocket('wss://relay.damus.io');
                this.nostrRelay.onopen = () => console.log('متصل بشبكة Nostr للإشعارات.');
                this.nostrRelay.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data[0] === 'EVENT' && data[2].kind === 20000) {
                        this.handleIncomingSignal(data[2].content);
                    }
                };
            },

            // 2. إرسال النداء اللحظي
            sendNostrSignal: function() {
                this.navigate('view-chat');
                this.setupWebRTC(true);
            },

            // 3. بناء اتصال WebRTC P2P (لا يمر بأي سيرفر)
            setupWebRTC: function(isInitiator) {
                this.peerConnection = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });

                // قناة نقل البيانات (النصوص والصور)
                if (isInitiator) {
                    this.dataChannel = this.peerConnection.createDataChannel('ghost-chat');
                    this.setupDataChannel();
                    
                    this.peerConnection.createOffer()
                        .then(offer => this.peerConnection.setLocalDescription(offer))
                        .then(() => {
                            // في الواقع: تُشفر وتُرسل عبر Nostr NIP-16
                            console.log('تم توليد العرض المباشر (P2P Offer)');
                            setTimeout(() => this.mockPeerAnswer(), 1000); // محاكاة رد الطرف الآخر
                        });
                } else {
                    this.peerConnection.ondatachannel = (event) => {
                        this.dataChannel = event.channel;
                        this.setupDataChannel();
                    };
                }
            },

            setupDataChannel: function() {
                this.dataChannel.onopen = () => {
                    document.getElementById('conn-status').innerText = '● متصل (P2P مُشفر)';
                    document.getElementById('conn-status').style.color = '#32d74b';
                    this.logSystem('تم إنشاء قناة الاتصال المباشر. الخوادم غير قادرة على رؤية هذه المحادثة.');
                };
                this.dataChannel.onmessage = (event) => {
                    if(event.data === 'FLAME_IMG') this.renderFlame(false);
                    else this.renderMessage(event.data, 'received');
                };
            },

            // 4. الإرسال الفعلي للرسائل عبر P2P
            sendTextMessage: function() {
                const input = document.getElementById('msg-input');
                const text = input.value.trim();
                if (!text) return;

                this.renderMessage(text, 'sent');
                input.value = '';

                // الإرسال المباشر إذا كانت القناة مفتوحة (P2P)
                if (this.dataChannel && this.dataChannel.readyState === 'open') {
                    this.dataChannel.send(text);
                } else {
                    // محاكاة استلام في وضع التجربة
                    setTimeout(() => this.renderMessage('رسالة مشفرة من الطرف الآخر (محاكاة)', 'received'), 1000);
                }
            },

            sendFlameMessage: function() {
                this.renderFlame(true);
                if (this.dataChannel && this.dataChannel.readyState === 'open') {
                    this.dataChannel.send('FLAME_IMG');
                }
            },

            // 5. هندسة الواجهة والتدمير الذاتي
            renderMessage: function(text, type) {
                const chat = document.getElementById('chat-messages');
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${type}`;
                msgDiv.innerText = text;
                chat.appendChild(msgDiv);
                chat.scrollTop = chat.scrollHeight;
            },

            renderFlame: function(isSent) {
                const chat = document.getElementById('chat-messages');
                const flameDiv = document.createElement('div');
                flameDiv.className = `message flame ${isSent ? 'sent' : 'received'}`;
                flameDiv.innerHTML = '🔥 صورة مؤقتة (اضغط للفتح)';
                
                flameDiv.onclick = function() {
                    flameDiv.innerHTML = '📸 [صورة عُرضت]';
                    flameDiv.style.color = '#fff';
                    flameDiv.style.borderColor = '#333';
                    setTimeout(() => flameDiv.remove(), 3000); // تدمير من الذاكرة
                };
                
                chat.appendChild(flameDiv);
                chat.scrollTop = chat.scrollHeight;
            },

            logSystem: function(text) {
                const chat = document.getElementById('chat-messages');
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message system';
                msgDiv.innerText = text;
                chat.appendChild(msgDiv);
            },

            destroyChat: function() {
                // تدمير الاتصال نهائياً
                if (this.dataChannel) this.dataChannel.close();
                if (this.peerConnection) this.peerConnection.close();
                
                // مسح الـ DOM نهائياً
                document.getElementById('chat-messages').innerHTML = '';
                document.getElementById('conn-status').innerText = '● جاري الاتصال...';
                document.getElementById('conn-status').style.color = 'var(--text-muted)';
                
                this.navigate('view-contacts');
            },

            mockPeerAnswer: function() {
                this.logSystem('الطرف الآخر استلم النداء ويقوم بالاتصال...');
                setTimeout(() => {
                    if(this.dataChannel) {
                        // محاكاة فتح القناة محلياً لتجربة الواجهة
                        Object.defineProperty(this.dataChannel, 'readyState', { value: 'open' });
                        this.dataChannel.onopen();
                    }
                }, 1500);
            },

            showModal: function(id) { document.getElementById(id).style.display = 'flex'; },
            closeModal: function(event, id) {
                if (event && event.target.id !== id) return;
                document.getElementById(id).style.display = 'none';
            }
        };
    </script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DecentraMarket</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#091540" />
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<style>
  .welcome {
    min-height: 100dvh;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: var(--sp-6) var(--sp-5) var(--sp-7);
  }
  .welcome__mark {
    width: 72px; height: 72px; border-radius: var(--radius-lg);
    background: linear-gradient(135deg, var(--brand-indigo), var(--brand-sky));
    box-shadow: var(--shadow-glow);
    margin-bottom: var(--sp-5);
  }
  .welcome__content { max-width: 460px; }
  .welcome__actions { display: flex; flex-direction: column; gap: var(--sp-3); max-width: 460px; }
  .lang-switch {
    position: absolute; top: var(--sp-5); inset-inline-end: var(--sp-5);
  }
</style>
</head>
<body>
  <button class="btn btn-ghost lang-switch" id="langBtn" style="position:fixed;">EN</button>

  <main class="welcome">
    <div class="welcome__content stack gap-4">
      <div class="welcome__mark"></div>
      <h1 data-i18n="welcome_title">سوق لا يخضع لأي جهة</h1>
      <p data-i18n="welcome_sub">بيع وشراء بحرية تامة. هويتك وبياناتك ومفاتيحك ملكك وحدك.</p>
    </div>

    <div class="welcome__actions">
      <a class="btn btn-primary btn-block" href="auth.html?mode=create" data-i18n="get_started">أنشئ حسابك</a>
      <a class="btn btn-ghost btn-block" href="auth.html?mode=restore" data-i18n="restore_account">لدي حساب بالفعل</a>
    </div>
  </main>

  <script type="module">
    import { getStoredIdentity } from "./js/identity/keygen.js";
    import { initTheme } from "./js/theme.js";
    import { applyTranslations, getLang, setLang } from "./js/i18n/translations.js";

    initTheme();
    applyTranslations();

    // Auto-route returning users straight to the marketplace.
    if (getStoredIdentity()) {
      window.location.replace("marketplace/home.html");
    }

    document.getElementById("langBtn").textContent = getLang() === "ar" ? "EN" : "عربي";
    document.getElementById("langBtn").addEventListener("click", () => {
      const next = getLang() === "ar" ? "en" : "ar";
      setLang(next);
      applyTranslations(next);
      document.getElementById("langBtn").textContent = next === "ar" ? "EN" : "عربي";
    });
  </script>
</body>
</html>

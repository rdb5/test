<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ميدان — السوق</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .cat-strip {
    display:flex; gap:8px; overflow-x:auto; padding:12px 16px;
  }
  .cat-chip {
    flex-shrink:0; padding:8px 16px; background:var(--surface);
    border:1px solid var(--hairline); border-radius:20px;
    font-size:13px; font-weight:600; color:var(--text-dim);
  }
  .cat-chip.active { background:var(--accent-dim); color:var(--accent-strong); border-color:var(--accent-dim); }
  .search-bar {
    margin:0 16px 4px; display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--hairline);
    border-radius:10px; padding:10px 12px; color:var(--text-faint); font-size:13.5px;
  }
  .search-bar svg { width:16px;height:16px; flex-shrink:0; }
</style>
</head>
<body>
<div class="app-shell">
  <div id="header-mount"></div>

  <main class="content">
    <div class="search-bar" id="search-bar"></div>

    <div class="cat-strip">
      <div class="cat-chip active">الكل</div>
      <div class="cat-chip">إلكترونيات</div>
      <div class="cat-chip">أثاث منزلي</div>
      <div class="cat-chip">أزياء</div>
      <div class="cat-chip">حِرف يدوية</div>
      <div class="cat-chip">مركبات</div>
    </div>

    <div class="grid-2" id="market-grid"></div>
  </main>

  <div id="nav-mount"></div>
</div>

<script src="js/app.js"></script>
<script>
  mountShell({ active: 'market', title: 'السوق' });
  document.getElementById('search-bar').innerHTML = icon('search') + ' ابحث في السوق...';

  const ITEMS = [
    { name:'كاميرا تصوير كلاسيكية', price:'٤٥٠ ر.س', place:'الرياض' },
    { name:'طاولة خشب طبيعي', price:'٩٠٠ ر.س', place:'جدة' },
    { name:'دراجة هوائية جبلية', price:'٦٥٠ ر.س', place:'الدمام' },
    { name:'مجموعة فخار يدوي', price:'١٢٠ ر.س', place:'مكة' },
    { name:'ساعة يد جلدية', price:'٢١٠ ر.س', place:'الرياض' },
    { name:'كرسي قراءة مريح', price:'٣٨٠ ر.س', place:'المدينة' },
  ];

  document.getElementById('market-grid').innerHTML = ITEMS.map(it => `
    <div class="tile">
      <div class="tile-media"></div>
      <div class="tile-body">
        <div class="tile-price">${it.price}</div>
        <div class="tile-title">${it.name}</div>
        <div class="tile-sub">${it.place}</div>
      </div>
    </div>
  `).join('');

  document.querySelectorAll('.cat-chip').forEach(c => {
    c.addEventListener('click', () => {
      document.querySelectorAll('.cat-chip').forEach(x => x.classList.remove('active'));
      c.classList.add('active');
    });
  });
</script>
</body>
</html>

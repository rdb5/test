<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ميدان — الرسائل</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .view { display:none; }
  .view.active { display:block; }
  #view-thread { padding-bottom: 74px; }
  .thread-head {
    display:flex; align-items:center; gap:10px; padding:12px 16px;
    border-bottom:1px solid var(--hairline);
    position:sticky; top:var(--header-h); background:var(--bg); z-index:20;
  }
  .thread-head .name { font-weight:700; font-size:14.5px; }
  .thread-head .status { font-size:11.5px; color:var(--accent); }
</style>
</head>
<body>
<div class="app-shell">
  <div id="header-mount"></div>

  <!-- قائمة المحادثات -->
  <div class="view active" id="view-list">
    <div class="trust-strip" id="trust-strip"></div>
    <main class="content" id="chat-list"></main>
  </div>

  <!-- محادثة مفردة -->
  <div class="view" id="view-thread">
    <div class="thread-head">
      <button class="icon-btn" id="thread-back"></button>
      <div class="avatar sm" id="thread-avatar"></div>
      <div>
        <div class="name" id="thread-name"></div>
        <div class="status">نشط الآن</div>
      </div>
    </div>
    <div class="thread" id="thread-body"></div>
    <div class="composer">
      <button class="icon-btn" id="attach-btn"></button>
      <input type="text" placeholder="اكتب رسالة مشفرة...">
      <button class="send-btn" id="send-btn"></button>
    </div>
  </div>

  <div id="nav-mount"></div>
</div>

<script src="js/app.js"></script>
<script>
  mountShell({ active: 'messages', title: 'الرسائل' });
  document.getElementById('trust-strip').innerHTML = icon('lock') + ' جميع رسائلك وملفاتك مشفّرة من طرفٍ إلى طرف';

  const CHATS = [
    { name:'نور حسن', preview:'وصلتني الصور، شكراً جزيلاً!', time:'الآن', unread:2 },
    { name:'مجموعة: هواة التصوير الليلي', preview:'خالد: أين صُوّرت هذه؟', time:'10:42', unread:0 },
    { name:'متجر مرايا للحِرف اليدوية', preview:'أنت: هل القطعة متوفرة بلون آخر؟', time:'أمس', unread:0 },
    { name:'سارة العتيبي', preview:'اللوحة الجديدة رائعة فعلاً', time:'الثلاثاء', unread:1 },
  ];

  document.getElementById('chat-list').innerHTML = CHATS.map((c,i) => `
    <div class="chat-row" onclick="openThread(${i})">
      <div class="avatar">${c.name.charAt(0)}</div>
      <div class="body">
        <div class="top-line"><div class="name">${c.name}</div><div class="time">${c.time}</div></div>
        <div class="preview">${c.preview}</div>
      </div>
      ${c.unread ? `<div class="unread">${c.unread}</div>` : ''}
    </div>
  `).join('');

  const THREAD_MSGS = [
    { from:'in', text:'أهلاً! شفت آخر منشور عندك، رائع 🌙' },
    { from:'out', text:'شكراً لك! أعمل على نسخة جديدة منه الآن' },
    { from:'in', text:'وصلتني الصور، شكراً جزيلاً!' },
  ];

  function openThread(i) {
    const c = CHATS[i];
    document.getElementById('thread-name').textContent = c.name;
    document.getElementById('thread-avatar').textContent = c.name.charAt(0);
    document.getElementById('thread-body').innerHTML = THREAD_MSGS.map(m => `
      <div class="bubble ${m.from}">${m.text}</div>
    `).join('');
    document.getElementById('view-list').classList.remove('active');
    document.getElementById('view-thread').classList.add('active');
  }

  document.getElementById('thread-back').innerHTML = icon('back');
  document.getElementById('thread-back').onclick = () => {
    document.getElementById('view-thread').classList.remove('active');
    document.getElementById('view-list').classList.add('active');
  };
  document.getElementById('attach-btn').innerHTML = icon('camera');
  document.getElementById('send-btn').innerHTML = icon('share');
</script>
</body>
</html>

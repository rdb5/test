<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ميدان — الإشعارات</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .notif-row {
    display:flex; gap:12px; padding:14px 16px; border-bottom:1px solid var(--hairline);
    position:relative;
  }
  .notif-row.unread::before {
    content:''; position:absolute; right:6px; top:20px;
    width:6px; height:6px; border-radius:50%; background:var(--accent);
  }
  .notif-row .text { font-size:14px; line-height:1.5; }
  .notif-row .text b { font-weight:700; }
  .notif-row .time { font-size:12px; color:var(--text-faint); margin-top:3px; }
</style>
</head>
<body>
<div class="app-shell">
  <div id="header-mount"></div>

  <div class="tabs">
    <div class="tab active">الكل</div>
    <div class="tab">التفاعلات</div>
    <div class="tab">المجتمعات</div>
    <div class="tab">الأمان</div>
  </div>

  <main class="content" id="notif-list"></main>

  <div id="nav-mount"></div>
</div>

<script src="js/app.js"></script>
<script>
  mountShell({ active: '', title: 'الإشعارات', page: 'notifications' });

  const NOTIFS = [
    { icon:'like', unread:true, text:'<b>سارة العتيبي</b> وأشخاص آخرون أعجبوا بمنشورك', time:'قبل ٥ دقائق' },
    { icon:'comment', unread:true, text:'<b>خالد المطيري</b> علّق على منشورك: "فكرة رائعة!"', time:'قبل ٣٠ دقيقة' },
    { icon:'groups', unread:false, text:'انضم <b>٣ أعضاء جدد</b> إلى مجموعتك "هواة التصوير الليلي"', time:'قبل ساعتين' },
    { icon:'shield', unread:false, text:'تم تسجيل الدخول إلى حسابك من جهاز جديد', time:'أمس' },
    { icon:'market', unread:false, text:'<b>نور حسن</b> راسلك بخصوص إعلانك في السوق', time:'أمس' },
  ];

  document.getElementById('notif-list').innerHTML = NOTIFS.map(n => `
    <div class="notif-row ${n.unread ? 'unread' : ''}">
      <div class="icon-wrap" style="border-radius:50%">${icon(n.icon)}</div>
      <div>
        <div class="text">${n.text}</div>
        <div class="time">${n.time}</div>
      </div>
    </div>
  `).join('');

  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
  }));
</script>
</body>
</html>
